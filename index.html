<body>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback, useMemo } = React;

    /* ===================== CONFIG CHAINE ===================== */
    const CHANNEL_ID = "UCb14vXu5c-_c7VH7CJMNnXw";
    const RSS_URL = `https://www.youtube.com/feeds/videos.xml?channel_id=${CHANNEL_ID}`;

    // Clé optionnelle "YouTube Data API v3". Si renseignée ici (ou via le panneau Admin),
    // le site charge TOUT le catalogue de la chaîne avec les vraies statistiques de vues,
    // sans passer par un proxy CORS tiers (bien plus fiable que le flux RSS ci-dessous).
    // -> Google Cloud Console > APIs & Services > créer une clé > activer "YouTube Data API v3"
    //    > restreindre la clé à votre nom de domaine (référents HTTP).
    const YOUTUBE_API_KEY = "";

    // Vidéos de secours : si la synchronisation (API ou RSS) échoue ou ne renvoie rien,
    // ces vidéos sont chargées automatiquement pour que le catalogue ne reste jamais vide.
    const FALLBACK_VIDEO_URLS = [
      "https://www.youtube.com/watch?v=WQrmiOMZrRk",
      "https://www.youtube.com/watch?v=XpdAJHyo_PU",
      "https://www.youtube.com/watch?v=3imnQO1MM_k",
      "https://www.youtube.com/watch?v=F5ffp2CP8rk",
      "https://www.youtube.com/watch?v=0dcY-benLkU",
      "https://www.youtube.com/watch?v=NlNzSz9iNrM",
    ];

    // Proxys CORS utilisés uniquement en secours (mode RSS), si aucune clé API n'est fournie.
    // Le flux RSS public de YouTube ne renvoie que les ~15 dernières vidéos et ne fournit
    // presque jamais de compteur de vues : c'est une solution de repli, pas la solution idéale.
    const CORS_PROXIES = [
      (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
      (url) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
      (url) => `https://corsproxy.io/?url=${encodeURIComponent(url)}`,
      (url) => `https://thingproxy.freeboard.io/fetch/${url}`,
    ];

    async function fetchWithTimeout(url, ms) {
      const controller = new AbortController();
      const t = setTimeout(() => controller.abort(), ms);
      try {
        const res = await fetch(url, { signal: controller.signal });
        return res;
      } finally {
        clearTimeout(t);
      }
    }

    async function fetchChannelRSS() {
      let lastError = null;
      for (const buildProxyUrl of CORS_PROXIES) {
        try {
          const res = await fetchWithTimeout(buildProxyUrl(RSS_URL), 9000);
          if (!res.ok) throw new Error("HTTP " + res.status);
          const text = await res.text();
          if (!text || text.indexOf("<feed") === -1) throw new Error("Réponse invalide");
          return text;
        } catch (err) {
          lastError = err;
        }
      }
      throw lastError || new Error("Impossible de contacter YouTube");
    }

    function parseYoutubeRSS(xmlText) {
      const doc = new DOMParser().parseFromString(xmlText, "text/xml");
      const parserError = doc.getElementsByTagName("parsererror")[0];
      if (parserError) throw new Error("Flux YouTube illisible");

      const YT_NS = "http://www.youtube.com/xml/schemas/2015";
      const MEDIA_NS = "http://search.yahoo.com/mrss/";
      const ATOM_NS = "http://www.w3.org/2005/Atom";

      const entries = Array.from(doc.getElementsByTagNameNS(ATOM_NS, "entry"));
      const seen = new Set();
      const videos = [];

      for (const entry of entries) {
        const videoIdNode = entry.getElementsByTagNameNS(YT_NS, "videoId")[0];
        const videoId = videoIdNode ? videoIdNode.textContent.trim() : null;
        if (!videoId || seen.has(videoId)) continue;

        const titleNode = entry.getElementsByTagNameNS(ATOM_NS, "title")[0];
        const title = titleNode ? titleNode.textContent.trim() : "Sans titre";
        const linkNode = entry.getElementsByTagNameNS(ATOM_NS, "link")[0];
        const watchUrl = linkNode ? linkNode.getAttribute("href") : `https://www.youtube.com/watch?v=${videoId}`;

        // --- FILTRE ANTI-SHORTS ---
        const isShortUrl = watchUrl.includes("/shorts/");
        const isShortTitle = /#(shorts?)\b/i.test(title);

        if (isShortUrl || isShortTitle) {
          continue; // On ignore les shorts
        }

        seen.add(videoId);

        const publishedNode = entry.getElementsByTagNameNS(ATOM_NS, "published")[0];
        const group = entry.getElementsByTagNameNS(MEDIA_NS, "group")[0];

        let desc = "";
        let views = 0;
        let thumb = `https://i.ytimg.com/vi/${videoId}/hqdefault.jpg`;

        if (group) {
          const descNode = group.getElementsByTagNameNS(MEDIA_NS, "description")[0];
          if (descNode) desc = descNode.textContent.trim();
          const thumbNode = group.getElementsByTagNameNS(MEDIA_NS, "thumbnail")[0];
          if (thumbNode && thumbNode.getAttribute("url")) thumb = thumbNode.getAttribute("url");
          const community = group.getElementsByTagNameNS(MEDIA_NS, "community")[0];
          if (community) {
            const statsNode = community.getElementsByTagNameNS(MEDIA_NS, "statistics")[0];
            if (statsNode) views = parseInt(statsNode.getAttribute("views") || "0", 10) || 0;
          }
        }

        videos.push({
          id: videoId,
          title,
          desc: desc || "Aucune description fournie pour cette vidéo.",
          published: publishedNode ? publishedNode.textContent.trim() : null,
          views,
          thumb,
          watchUrl,
        });
      }

      videos.sort((a, b) => new Date(b.published || 0) - new Date(a.published || 0));
      return videos;
    }

    /* ===================== CHARGEMENT VIA YOUTUBE DATA API (mode complet) ===================== */
    // Convertit une durée ISO 8601 (ex : "PT1M32S") en secondes.
    function isoDurationToSeconds(iso) {
      if (!iso) return 0;
      const m = /^PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?$/.exec(iso);
      if (!m) return 0;
      const h = parseInt(m[1] || "0", 10);
      const min = parseInt(m[2] || "0", 10);
      const s = parseInt(m[3] || "0", 10);
      return h * 3600 + min * 60 + s;
    }

    async function fetchChannelViaApi(apiKey, channelId) {
      const base = "https://www.googleapis.com/youtube/v3";

      const chRes = await fetchWithTimeout(`${base}/channels?part=contentDetails&id=${channelId}&key=${apiKey}`, 9000);
      const chJson = await chRes.json();
      if (chJson.error) throw new Error(chJson.error.message || "Erreur API YouTube (channels)");
      const uploadsPlaylistId = chJson.items && chJson.items[0] && chJson.items[0].contentDetails
        ? chJson.items[0].contentDetails.relatedPlaylists.uploads
        : null;
      if (!uploadsPlaylistId) throw new Error("Chaîne introuvable avec cette clé API");

      // 1. Pagination sur la playlist "uploads" pour récupérer TOUTES les vidéos.
      let items = [];
      let pageToken = "";
      let safety = 0;
      do {
        const url = `${base}/playlistItems?part=snippet,contentDetails&maxResults=50&playlistId=${uploadsPlaylistId}&key=${apiKey}${pageToken ? `&pageToken=${pageToken}` : ""}`;
        const res = await fetchWithTimeout(url, 9000);
        const json = await res.json();
        if (json.error) throw new Error(json.error.message || "Erreur API YouTube (playlistItems)");
        items = items.concat(json.items || []);
        pageToken = json.nextPageToken || "";
        safety += 1;
      } while (pageToken && safety < 40);

      const ids = items
        .map((it) => it.contentDetails && it.contentDetails.videoId)
        .filter(Boolean);

      // 2. Récupération des statistiques + durée réelle (par lots de 50 = limite de l'API).
      const statsById = new Map();
      for (let i = 0; i < ids.length; i += 50) {
        const batch = ids.slice(i, i + 50).join(",");
        const res = await fetchWithTimeout(`${base}/videos?part=statistics,contentDetails&id=${batch}&key=${apiKey}`, 9000);
        const json = await res.json();
        if (json.error) throw new Error(json.error.message || "Erreur API YouTube (videos)");
        (json.items || []).forEach((v) => statsById.set(v.id, v));
      }

      const seen = new Set();
      const videos = [];
      for (const it of items) {
        const videoId = it.contentDetails && it.contentDetails.videoId;
        if (!videoId || seen.has(videoId)) continue;

        const stats = statsById.get(videoId);
        const durationSec = stats ? isoDurationToSeconds(stats.contentDetails.duration) : 0;
        const title = (it.snippet && it.snippet.title) || "Sans titre";

        // Filtre anti-Shorts fiable : durée <= 60s ou hashtag #shorts dans le titre.
        if ((durationSec > 0 && durationSec <= 60) || /#(shorts?)\b/i.test(title)) continue;
        // YouTube place parfois des vidéos "privées"/"supprimées" en playlist : on les ignore.
        if (title === "Private video" || title === "Deleted video") continue;

        seen.add(videoId);
        const snippet = it.snippet || {};
        const thumbs = snippet.thumbnails || {};
        const thumb = (thumbs.maxres || thumbs.standard || thumbs.high || thumbs.medium || thumbs.default || {}).url
          || `https://i.ytimg.com/vi/${videoId}/hqdefault.jpg`;

        videos.push({
          id: videoId,
          title,
          desc: (snippet.description && snippet.description.trim()) || "Aucune description fournie pour cette vidéo.",
          published: snippet.publishedAt || null,
          views: stats ? parseInt(stats.statistics.viewCount || "0", 10) || 0 : 0,
          thumb,
          watchUrl: `https://www.youtube.com/watch?v=${videoId}`,
          source: "api",
        });
      }

      videos.sort((a, b) => new Date(b.published || 0) - new Date(a.published || 0));
      return videos;
    }

    // Récupère les infos publiques (titre + miniature) d'une vidéo via oEmbed, sans clé API.
    // Utilisé pour l'ajout manuel d'une vidéo dans le panneau Admin.
    async function fetchVideoOEmbed(videoId) {
      const url = `https://www.youtube.com/oembed?url=${encodeURIComponent(`https://www.youtube.com/watch?v=${videoId}`)}&format=json`;
      const res = await fetchWithTimeout(url, 8000);
      if (!res.ok) throw new Error("Vidéo introuvable ou privée");
      const json = await res.json();
      return {
        id: videoId,
        title: json.title || "Sans titre",
        desc: "Vidéo ajoutée manuellement.",
        published: new Date().toISOString(),
        views: 0,
        thumb: `https://i.ytimg.com/vi/${videoId}/hqdefault.jpg`,
        watchUrl: `https://www.youtube.com/watch?v=${videoId}`,
        source: "manual",
      };
    }

    // Extrait un ID de vidéo YouTube (11 caractères) depuis une URL ou un ID brut.
    function extractYoutubeId(input) {
      if (!input) return null;
      const trimmed = input.trim();
      const patterns = [
        /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/,
      ];
      for (const p of patterns) {
        const m = p.exec(trimmed);
        if (m) return m[1];
      }
      if (/^[a-zA-Z0-9_-]{11}$/.test(trimmed)) return trimmed;
      return null;
    }

    // Charge les vidéos de secours (FALLBACK_VIDEO_URLS) via oEmbed, une par une,
    // en ignorant celles qui échouent (privée/supprimée) sans bloquer les autres.
    async function fetchFallbackVideos() {
      const ids = FALLBACK_VIDEO_URLS.map(extractYoutubeId).filter(Boolean);
      const results = await Promise.all(
        ids.map((id) =>
          fetchVideoOEmbed(id)
            .then((v) => ({ ...v, source: "fallback" }))
            .catch(() => null)
        )
      );
      return results.filter(Boolean);
    }

    /* ===================== FORMATAGE ===================== */
    const numberFormatterFR = new Intl.NumberFormat("fr-FR");
    const dateFormatterFR = new Intl.DateTimeFormat("fr-FR", { day: "numeric", month: "long", year: "numeric" });

    function formatViews(n) {
      if (!n) return "Vues non communiquées";
      return `${numberFormatterFR.format(n)} vue${n > 1 ? "s" : ""}`;
    }

    function formatDate(iso) {
      if (!iso) return "Date inconnue";
      try { return dateFormatterFR.format(new Date(iso)); } catch (e) { return "Date inconnue"; }
    }

    function formatTimeAgo(iso) {
      if (!iso) return "";
      const diffMs = Date.now() - new Date(iso).getTime();
      const sec = Math.floor(diffMs / 1000);
      const units = [
        ["an", 31536000], ["mois", 2592000], ["semaine", 604800],
        ["jour", 86400], ["heure", 3600], ["minute", 60],
      ];
      for (const [label, secs] of units) {
        const val = Math.floor(sec / secs);
        if (val >= 1) return `il y a ${val} ${label}${val > 1 && label !== "mois" ? "s" : ""}`;
      }
      return "à l'instant";
    }

    /* ===================== HOOKS RESPONSIVE ===================== */
    function useMediaQuery(query) {
      const [matches, setMatches] = useState(() => typeof window !== "undefined" && window.matchMedia(query).matches);
      useEffect(() => {
        const mql = window.matchMedia(query);
        const handler = (e) => setMatches(e.matches);
        mql.addEventListener ? mql.addEventListener("change", handler) : mql.addListener(handler);
        setMatches(mql.matches);
        return () => {
          mql.removeEventListener ? mql.removeEventListener("change", handler) : mql.removeListener(handler);
        };
      }, [query]);
      return matches;
    }

    function useRealViewportHeight() {
      useEffect(() => {
        const setVh = () => document.documentElement.style.setProperty("--vh", `${window.innerHeight * 0.01}px`);
        setVh();
        // Ne pas écouter "resize" : Chrome Android le déclenche quand la barre
        // d'adresse apparaît/disparaît pendant le scroll, ce qui provoquait un jump.
        // On recalcule uniquement lors d'un vrai changement d'orientation.
        window.addEventListener("orientationchange", setVh);
        return () => {
          window.removeEventListener("orientationchange", setVh);
        };
      }, []);
    }

    /* ===================== PLAYER ===================== */
    function NetflixPlayer({ movie, onClose, onNext }) {
      const playerRef = useRef(null);
      const [isPlaying, setIsPlaying] = useState(true);
      const [isReady, setIsReady] = useState(false);
      const [isBuffering, setIsBuffering] = useState(false);
      const [currentTime, setCurrentTime] = useState(0);
      const [duration, setDuration] = useState(0);
      const [volume, setVolume] = useState(100);
      const [isMuted, setIsMuted] = useState(false);
      const [controlsVisible, setControlsVisible] = useState(true);
      const [seekFlash, setSeekFlash] = useState(null);
      const [centerFlash, setCenterFlash] = useState(null);
      const [buffered, setBuffered] = useState(0);
      const [hoverPreview, setHoverPreview] = useState(null);
      const [isScrubbing, setIsScrubbing] = useState(false);
      const [playbackRate, setPlaybackRate] = useState(1);
      const hideControlsTimeout = useRef(null);
      const lastTapRef = useRef({ time: 0, zone: null });
      const progressRef = useRef(null);
      const isTouch = useMediaQuery("(hover: none)");

      useEffect(() => {
        let ytPlayer;
        let destroyed = false;

        const onYouTubeIframeAPIReady = () => {
          ytPlayer = new window.YT.Player("netflix-yt-iframe", {
            events: {
              onReady: (event) => {
                if (destroyed) return;
                playerRef.current = event.target;
                event.target.playVideo();
                setDuration(event.target.getDuration());
                setIsReady(true);
              },
              onStateChange: (event) => {
                if (event.data === window.YT.PlayerState.PLAYING) { setIsPlaying(true); setIsBuffering(false); }
                else if (event.data === window.YT.PlayerState.PAUSED) setIsPlaying(false);
                else if (event.data === window.YT.PlayerState.BUFFERING) setIsBuffering(true);
                else if (event.data === window.YT.PlayerState.ENDED) onNext();
              },
            },
          });
        };

        if (!window.YT || !window.YT.Player) {
          const tag = document.createElement("script");
          tag.src = "https://www.youtube.com/iframe_api";
          window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;
          document.body.appendChild(tag);
        } else {
          onYouTubeIframeAPIReady();
        }

        const timer = setInterval(() => {
          if (playerRef.current && playerRef.current.getCurrentTime) {
            setCurrentTime(playerRef.current.getCurrentTime());
            setDuration(playerRef.current.getDuration() || 0);
            if (playerRef.current.getVideoLoadedFraction) {
              setBuffered(playerRef.current.getVideoLoadedFraction() || 0);
            }
          }
        }, 500);

        return () => {
          destroyed = true;
          clearInterval(timer);
          if (ytPlayer && ytPlayer.destroy) ytPlayer.destroy();
        };
      }, [movie.id]);

      const togglePlay = useCallback(() => {
        if (!playerRef.current) return;
        const playing = playerRef.current.getPlayerState() === 1;
        if (playing) playerRef.current.pauseVideo();
        else playerRef.current.playVideo();
        setCenterFlash({ icon: playing ? "pause" : "play", key: Date.now() });
        setTimeout(() => setCenterFlash(null), 550);
      }, []);

      const seekToClientX = useCallback((clientX) => {
        if (!progressRef.current || !duration) return null;
        const rect = progressRef.current.getBoundingClientRect();
        const ratio = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
        const targetTime = ratio * duration;
        if (playerRef.current) playerRef.current.seekTo(targetTime, true);
        setCurrentTime(targetTime);
        return ratio;
      }, [duration]);

      const handleProgressPointerDown = (e) => {
        setIsScrubbing(true);
        seekToClientX(e.clientX);
        showControlsTemporarily();
      };

      const handleProgressHover = (e) => {
        if (!duration) return;
        const rect = e.currentTarget.getBoundingClientRect();
        const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        setHoverPreview({ percent: ratio * 100, time: ratio * duration });
      };

      useEffect(() => {
        if (!isScrubbing) return;
        const handleMove = (e) => {
          const clientX = e.touches ? e.touches[0].clientX : e.clientX;
          const ratio = seekToClientX(clientX);
          if (ratio != null && duration) setHoverPreview({ percent: ratio * 100, time: ratio * duration });
        };
        const handleUp = () => { setIsScrubbing(false); setHoverPreview(null); };
        window.addEventListener("pointermove", handleMove);
        window.addEventListener("pointerup", handleUp);
        window.addEventListener("touchmove", handleMove, { passive: true });
        window.addEventListener("touchend", handleUp);
        return () => {
          window.removeEventListener("pointermove", handleMove);
          window.removeEventListener("pointerup", handleUp);
          window.removeEventListener("touchmove", handleMove);
          window.removeEventListener("touchend", handleUp);
        };
      }, [isScrubbing, seekToClientX, duration]);

      const handleSkip = useCallback((seconds) => {
        if (playerRef.current) {
          const newTime = Math.max(0, playerRef.current.getCurrentTime() + seconds);
          playerRef.current.seekTo(newTime, true);
        }
      }, []);

      const flashSeek = (dir, seconds) => {
        handleSkip(seconds);
        setSeekFlash({ dir, seconds, key: Date.now() });
        setTimeout(() => setSeekFlash(null), 600);
      };

      const handleVolumeChange = (e) => {
        const val = Number(e.target.value);
        setVolume(val);
        if (playerRef.current) {
          playerRef.current.setVolume(val);
          if (val === 0) { playerRef.current.mute(); setIsMuted(true); }
          else { playerRef.current.unMute(); setIsMuted(false); }
        }
      };

      const toggleMute = useCallback(() => {
        if (!playerRef.current) return;
        if (playerRef.current.isMuted()) { playerRef.current.unMute(); setIsMuted(false); }
        else { playerRef.current.mute(); setIsMuted(true); }
      }, []);

      const toggleFullscreen = useCallback(() => {
        const elem = document.getElementById("netflix-player-root");
        if (!document.fullscreenElement) elem.requestFullscreen().catch(() => {});
        else document.exitFullscreen();
      }, []);

      const cyclePlaybackRate = useCallback(() => {
        const speeds = [0.5, 0.75, 1, 1.25, 1.5, 2];
        const idx = speeds.indexOf(playbackRate);
        const next = speeds[(idx + 1) % speeds.length];
        setPlaybackRate(next);
        if (playerRef.current && playerRef.current.setPlaybackRate) playerRef.current.setPlaybackRate(next);
      }, [playbackRate]);

      const changeVolume = useCallback((delta) => {
        if (!playerRef.current) return;
        const next = Math.max(0, Math.min(100, playerRef.current.getVolume() + delta));
        playerRef.current.setVolume(next);
        setVolume(next);
        if (next === 0) setIsMuted(true); else { playerRef.current.unMute(); setIsMuted(false); }
      }, []);

      useEffect(() => {
        const onKeyDown = (e) => {
          switch (e.key) {
            case " ": case "k": e.preventDefault(); togglePlay(); break;
            case "ArrowRight": handleSkip(10); break;
            case "ArrowLeft": handleSkip(-10); break;
            case "ArrowUp": e.preventDefault(); changeVolume(10); break;
            case "ArrowDown": e.preventDefault(); changeVolume(-10); break;
            case "m": toggleMute(); break;
            case "f": toggleFullscreen(); break;
            case "Escape": onClose(); break;
          }
        };
        window.addEventListener("keydown", onKeyDown);
        return () => window.removeEventListener("keydown", onKeyDown);
      }, [togglePlay, handleSkip, changeVolume, toggleMute, toggleFullscreen, onClose]);

      const showControlsTemporarily = useCallback(() => {
        setControlsVisible(true);
        clearTimeout(hideControlsTimeout.current);
        hideControlsTimeout.current = setTimeout(() => {
          if (isPlaying) setControlsVisible(false);
        }, isTouch ? 4000 : 3200);
      }, [isPlaying, isTouch]);

      useEffect(() => { showControlsTemporarily(); }, [isPlaying]);

      const handleZoneTap = (zone) => {
        const now = Date.now();
        const isDoubleTap = zone === lastTapRef.current.zone && now - lastTapRef.current.time < 320;
        lastTapRef.current = { time: now, zone };

        if (zone === "center") {
          if (!controlsVisible) { showControlsTemporarily(); return; }
          if (isDoubleTap) togglePlay();
          else showControlsTemporarily();
          return;
        }

        if (isDoubleTap) {
          flashSeek(zone, zone === "left" ? -10 : 10);
        }
        showControlsTemporarily();
      };

      const formatTime = (sec) => {
        if (isNaN(sec)) return "00:00";
        const h = Math.floor(sec / 3600);
        const m = Math.floor((sec % 3600) / 60);
        const s = Math.floor(sec % 60);
        return h > 0
          ? `${h}:${m < 10 ? "0" : ""}${m}:${s < 10 ? "0" : ""}${s}`
          : `${m < 10 ? "0" : ""}${m}:${s < 10 ? "0" : ""}${s}`;
      };

      const progressPercent = duration > 0 ? (currentTime / duration) * 100 : 0;
      const nearEnd = duration > 0 && duration - currentTime < 12 && duration - currentTime > 0;

      return (
        <div
          id="netflix-player-root"
          className={`netflix-player-overlay ${!controlsVisible && isPlaying && !isTouch ? "hide-cursor" : ""}`}
          onMouseMove={!isTouch ? showControlsTemporarily : undefined}
          onDoubleClick={!isTouch ? toggleFullscreen : undefined}
        >
          <div className="player-video-container">
            <iframe
              id="netflix-yt-iframe"
              src={`https://www.youtube.com/embed/${movie.id}?enablejsapi=1&controls=0&autoplay=1&modestbranding=1&rel=0&iv_load_policy=3&playsinline=1`}
              allow="autoplay; fullscreen"
            ></iframe>
          </div>

          {isTouch && (
            <div className="player-tap-zones">
              <div className="player-tap-zone" onClick={() => handleZoneTap("left")}></div>
              <div className="player-tap-zone center" onClick={() => handleZoneTap("center")}></div>
              <div className="player-tap-zone" onClick={() => handleZoneTap("right")}></div>
            </div>
          )}

          {seekFlash && (
            <div className={`seek-flash ${seekFlash.dir}`} key={seekFlash.key}>
              <i className={`fas ${seekFlash.dir === "left" ? "fa-backward" : "fa-forward"}`}></i>
              <span>{seekFlash.dir === "left" ? "-10s" : "+10s"}</span>
            </div>
          )}

          {centerFlash && (
            <div className="center-flash" key={centerFlash.key}>
              <i className={`fas ${centerFlash.icon === "play" ? "fa-play" : "fa-pause"}`}></i>
            </div>
          )}

          {!isReady && <div className="player-loading"></div>}
          {isReady && isBuffering && <div className="player-buffering"></div>}

          <div className="kbd-hint" style={{ opacity: controlsVisible ? 1 : 0 }}>
            <span><kbd>Espace</kbd>lecture</span>
            <span><kbd>←→</kbd>avance/recule</span>
            <span><kbd>F</kbd>plein écran</span>
            <span><kbd>Échap</kbd>quitter</span>
          </div>

          <div className="player-top-bar" style={{ opacity: controlsVisible ? 1 : 0, pointerEvents: controlsVisible ? "auto" : "none" }}>
            <button className="back-btn" onClick={onClose} title="Retour à l'accueil">
              <i className="fas fa-arrow-left"></i>
            </button>
            <div className="player-title-block">
              <span className="player-movie-title">{movie.title}</span>
              <div className="player-movie-meta">
                <span>{formatViews(movie.views)}</span>
                <span>{formatDate(movie.published)}</span>
              </div>
            </div>
            {nearEnd && (
              <button className="player-next-btn" onClick={onNext}>
                <i className="fas fa-step-forward"></i> <span>Lecture suivante</span>
              </button>
            )}
          </div>

          <div className="player-controls-bottom" style={{ opacity: controlsVisible ? 1 : 0, pointerEvents: controlsVisible ? "auto" : "none" }}>
            <div
              ref={progressRef}
              className={`progress-bar-container ${isScrubbing ? "scrubbing" : ""}`}
              onPointerDown={handleProgressPointerDown}
              onMouseMove={!isTouch ? handleProgressHover : undefined}
              onMouseLeave={() => !isScrubbing && setHoverPreview(null)}
            >
              <div className="progress-bar-buffered" style={{ width: `${Math.max(buffered * 100, progressPercent)}%` }}></div>
              <div className="progress-bar-fill" style={{ width: `${progressPercent}%` }}>
                <div className="progress-bar-scrubber"></div>
              </div>
              {hoverPreview && (
                <div className="progress-hover-preview" style={{ left: `${hoverPreview.percent}%` }}>
                  {formatTime(hoverPreview.time)}
                </div>
              )}
            </div>

            <div className="controls-row">
              <div className="controls-left">
                <button className="control-btn control-btn-play" onClick={togglePlay}>
                  <i className={isPlaying ? "fas fa-pause" : "fas fa-play"}></i>
                </button>
                <button className="control-btn" onClick={() => flashSeek("left", -10)} title="Reculer 10s">
                  <i className="fas fa-undo-alt"></i>
                </button>
                <button className="control-btn" onClick={() => flashSeek("right", 10)} title="Avancer 10s">
                  <i className="fas fa-redo-alt"></i>
                </button>
                <button className="control-btn" onClick={onNext} title="Suivant">
                  <i className="fas fa-step-forward"></i>
                </button>
                {!isTouch && (
                  <div className="volume-container">
                    <button className="control-btn" onClick={toggleMute} title={isMuted ? "Activer le son" : "Couper le son"}>
                      <i className={isMuted || volume === 0 ? "fas fa-volume-mute" : volume < 50 ? "fas fa-volume-down" : "fas fa-volume-up"}></i>
                    </button>
                    <input
                      type="range" min="0" max="100"
                      value={isMuted ? 0 : volume}
                      onChange={handleVolumeChange}
                      className="volume-slider"
                      style={{ background: `linear-gradient(to right, var(--zigou-red-bright) ${isMuted ? 0 : volume}%, rgba(255,255,255,0.28) ${isMuted ? 0 : volume}%)` }}
                    />
                  </div>
                )}
                {isTouch && (
                  <button className="control-btn" onClick={toggleMute} title={isMuted ? "Activer le son" : "Couper le son"}>
                    <i className={isMuted || volume === 0 ? "fas fa-volume-mute" : volume < 50 ? "fas fa-volume-down" : "fas fa-volume-up"}></i>
                  </button>
                )}
                <div className="time-display">{formatTime(currentTime)} / {formatTime(duration)}</div>
              </div>

              <div className="controls-right">
                <button className="control-btn speed-btn" onClick={cyclePlaybackRate} title="Vitesse de lecture">
                  {playbackRate}x
                </button>
                <button className="control-btn" onClick={toggleFullscreen} title="Plein écran">
                  <i className="fas fa-expand"></i>
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    /* ===================== CARD ===================== */
    function MovieCard({ movie, onPlay, onInfo, isFavorite, onToggleFavorite }) {
      const isTouch = useMediaQuery("(hover: none)");
      const isNarrow = useMediaQuery("(max-width: 760px)");
      const [hovered, setHovered] = useState(false);
      const [showPreview, setShowPreview] = useState(false);
      const [previewLoaded, setPreviewLoaded] = useState(false);
      const [previewMuted, setPreviewMuted] = useState(true);
      const previewTimeout = useRef(null);
      const showExpanded = isTouch ? true : hovered;
      const previewSrc = `https://www.youtube.com/embed/${movie.id}?autoplay=1&mute=${previewMuted ? 1 : 0}&controls=0&modestbranding=1&rel=0&loop=1&playlist=${movie.id}`;

      const handleEnter = () => {
        if (isTouch) return;
        setHovered(true);
        clearTimeout(previewTimeout.current);
        previewTimeout.current = setTimeout(() => setShowPreview(true), 500);
      };

      const handleLeave = () => {
        if (isTouch) return;
        setHovered(false);
        clearTimeout(previewTimeout.current);
        setShowPreview(false);
        setPreviewLoaded(false);
      };

      useEffect(() => () => clearTimeout(previewTimeout.current), []);

      return (
        <div className="card-container">
          <div
            className={`card ${showExpanded ? "expanded" : ""}`}
            onMouseEnter={handleEnter}
            onMouseLeave={handleLeave}
            onClick={() => (isTouch || hovered) && onInfo(movie)}
          >
            <img src={movie.thumb} alt={movie.title} className="card-img" loading="lazy" />

            {showPreview && !isTouch && !isNarrow && (
              <>
                {!previewLoaded && <div className="card-preview-shimmer"></div>}
                <iframe
                  src={previewSrc}
                  className={`card-preview ${previewLoaded ? "loaded" : ""}`}
                  frameBorder="0"
                  allow="autoplay"
                  onLoad={() => setPreviewLoaded(true)}
                ></iframe>
                <button
                  className="card-preview-sound"
                  onClick={(e) => { e.stopPropagation(); setPreviewLoaded(false); setPreviewMuted((m) => !m); }}
                  title={previewMuted ? "Activer le son" : "Couper le son"}
                >
                  <i className={`fas ${previewMuted ? "fa-volume-mute" : "fa-volume-up"}`}></i>
                </button>
              </>
            )}

            <div className="card-body">
              <div className="card-actions">
                <div className="card-actions-left">
                  <button className="icon-btn icon-btn-play" onClick={(e) => { e.stopPropagation(); onPlay(movie); }} title="Regarder">
                    <i className="fas fa-play"></i>
                  </button>
                  <button
                    className={`icon-btn ${isFavorite ? "active" : ""}`}
                    onClick={(e) => { e.stopPropagation(); onToggleFavorite(movie.id); }}
                    title={isFavorite ? "Retirer de ma liste" : "Ajouter à ma liste"}
                  >
                    <i className={isFavorite ? "fas fa-check" : "fas fa-plus"}></i>
                  </button>
                </div>
                <button className="icon-btn" onClick={(e) => { e.stopPropagation(); onInfo(movie); }} title="Plus d'infos">
                  <i className="fas fa-chevron-down"></i>
                </button>
              </div>

              <div className="card-info">
                <span>{formatViews(movie.views)}</span>
                <span>•</span>
                <span>{formatTimeAgo(movie.published)}</span>
              </div>

              <div className="card-title-text">{movie.title}</div>
              <div className="card-tags">{movie.desc}</div>
            </div>
          </div>
        </div>
      );
    }

    /* ===================== INFO MODAL ===================== */
    function InfoModal({ movie, onClose, onPlay, isFavorite, onToggleFavorite }) {
      const previewSrc = `https://www.youtube.com/embed/${movie.id}?autoplay=1&mute=1&controls=0&modestbranding=1&rel=0&loop=1&playlist=${movie.id}`;
      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal-box" onClick={(e) => e.stopPropagation()}>
            <div className="modal-hero">
              <iframe src={previewSrc} allow="autoplay"></iframe>
              <div className="modal-hero-overlay"></div>
              <button className="modal-close" onClick={onClose}><i className="fas fa-times"></i></button>
              <div className="modal-hero-title">{movie.title}</div>
              <div className="modal-hero-btns">
                <button className="btn-icon-round" style={{ background: '#fff', color: '#000', border: 'none', width: 46, height: 46 }} onClick={() => onPlay(movie)}>
                  <i className="fas fa-play"></i>
                </button>
                <button className="btn-icon-round" onClick={() => onToggleFavorite(movie.id)}>
                  <i className={isFavorite ? "fas fa-check" : "fas fa-plus"}></i>
                </button>
              </div>
            </div>
            <div className="modal-body">
              <div className="modal-meta-row">
                <span className="match">{formatViews(movie.views)}</span>
                <span>{formatDate(movie.published)}</span>
              </div>
              <p className="modal-desc">{movie.desc}</p>
              <a className="modal-yt-link" href={movie.watchUrl} target="_blank" rel="noopener noreferrer">
                <i className="fab fa-youtube"></i> Voir la fiche originale sur YouTube
              </a>
            </div>
          </div>
        </div>
      );
    }

    /* ===================== APP ===================== */
    function App() {
      useRealViewportHeight();
      const isNarrow = useMediaQuery("(max-width: 760px)");

      const [currentTab, setCurrentTab] = useState("home");
      const [searchTerm, setSearchTerm] = useState("");
      const [activeMovie, setActiveMovie] = useState(null);
      const [infoMovie, setInfoMovie] = useState(null);
      const [heroIndex, setHeroIndex] = useState(0);
      const [scrolled, setScrolled] = useState(false);
      const [navOpen, setNavOpen] = useState(false);
      const [mobileSearchOpen, setMobileSearchOpen] = useState(false);

      /* STATE ADMIN & MOT DE PASSE */
      const [isAdminAuthenticated, setIsAdminAuthenticated] = useState(false);
      const [secretInput, setSecretInput] = useState("");
      const [passError, setPassError] = useState(false);
      const SECRET_CODE = "2009zigoune@";

      const [videos, setVideos] = useState([]);
      const [isRefreshing, setIsRefreshing] = useState(false);
      const [lastSync, setLastSync] = useState(null);
      const [syncMode, setSyncMode] = useState(null); // "api" | "rss"
      const [apiKeyOverride, setApiKeyOverride] = useState("");
      const [addVideoInput, setAddVideoInput] = useState("");
      const [addVideoError, setAddVideoError] = useState("");
      const [isAddingVideo, setIsAddingVideo] = useState(false);

      const activeApiKey = (apiKeyOverride || YOUTUBE_API_KEY || "").trim();

      const loadFallbackVideos = useCallback(async () => {
        try {
          const fallback = await fetchFallbackVideos();
          if (fallback.length === 0) return;
          setVideos((prev) => {
            const map = new Map();
            [...fallback, ...prev].forEach((v) => map.set(v.id, v));
            const merged = Array.from(map.values());
            merged.sort((a, b) => new Date(b.published || 0) - new Date(a.published || 0));
            return merged;
          });
          setSyncMode((prevMode) => prevMode || "fallback");
        } catch (fallbackErr) {
          console.warn("Échec du chargement des vidéos de secours:", fallbackErr);
        }
      }, []);

      const syncVideos = useCallback(async () => {
        setIsRefreshing(true);
        try {
          if (activeApiKey) {
            // Mode complet : catalogue entier + vraies statistiques via l'API officielle.
            const parsed = await fetchChannelViaApi(activeApiKey, CHANNEL_ID);
            setVideos((prev) => {
              const manual = prev.filter((v) => v.source === "manual");
              const map = new Map();
              [...parsed, ...manual].forEach((v) => map.set(v.id, v));
              const merged = Array.from(map.values());
              merged.sort((a, b) => new Date(b.published || 0) - new Date(a.published || 0));
              return merged;
            });
            setSyncMode("api");
          } else {
            // Mode de secours : flux RSS public (15 dernières vidéos, via proxy CORS).
            const xml = await fetchChannelRSS();
            const parsed = parseYoutubeRSS(xml);
            setVideos((prev) => {
              const map = new Map();
              [...prev, ...parsed.map((v) => ({ ...v, source: v.source || "rss" }))].forEach((v) => map.set(v.id, v));
              const merged = Array.from(map.values());
              merged.sort((a, b) => new Date(b.published || 0) - new Date(a.published || 0));
              return merged;
            });
            setSyncMode("rss");
          }
          setLastSync(new Date());
        } catch (err) {
          console.warn("Échec du chargement des vidéos YouTube:", err);
        } finally {
          setIsRefreshing(false);
        }
      }, [activeApiKey]);

      // Au lancement : on affiche d'abord immédiatement les vidéos de secours pour que
      // l'utilisateur ait toujours du contenu à voir sans attendre, puis on lance en
      // parallèle la synchronisation avec YouTube (API ou RSS) qui viendra compléter /
      // remplacer ce catalogue de secours dès que les vraies données sont disponibles.
      useEffect(() => {
        loadFallbackVideos();
        syncVideos();
      }, [syncVideos, loadFallbackVideos]);

      const handleAddVideo = async (e) => {
        e.preventDefault();
        setAddVideoError("");
        const videoId = extractYoutubeId(addVideoInput);
        if (!videoId) {
          setAddVideoError("Lien ou identifiant YouTube invalide. Exemple : https://www.youtube.com/watch?v=XXXXXXXXXXX");
          return;
        }
        if (videos.some((v) => v.id === videoId)) {
          setAddVideoError("Cette vidéo est déjà dans le catalogue.");
          return;
        }
        setIsAddingVideo(true);
        try {
          const video = await fetchVideoOEmbed(videoId);
          setVideos((prev) => [video, ...prev]);
          setAddVideoInput("");
        } catch (err) {
          setAddVideoError(err.message || "Impossible de récupérer cette vidéo.");
        } finally {
          setIsAddingVideo(false);
        }
      };

      const handlePassSubmit = (e) => {
        e.preventDefault();
        if (secretInput === SECRET_CODE) {
          setIsAdminAuthenticated(true);
          setPassError(false);
        } else {
          setPassError(true);
        }
      };

      const heroMovies = useMemo(() => videos.slice(0, 5), [videos]);

      useEffect(() => {
        if (currentTab !== "home" || searchTerm || activeMovie || heroMovies.length < 2) return;
        const interval = setInterval(() => setHeroIndex((prev) => (prev + 1) % heroMovies.length), 6000);
        return () => clearInterval(interval);
      }, [currentTab, searchTerm, heroMovies.length, activeMovie]);

      useEffect(() => {
        const onScroll = () => setScrolled(window.scrollY > 20);
        window.addEventListener("scroll", onScroll);
        return () => window.removeEventListener("scroll", onScroll);
      }, []);

      const [favorites, setFavorites] = useState([]);
      const toggleFavorite = (id) => {
        setFavorites((prev) => (prev.includes(id) ? prev.filter((f) => f !== id) : [...prev, id]));
      };

      const playFromInfo = (movie) => { setInfoMovie(null); setActiveMovie(movie); };

      const playNext = () => {
        if (!videos.length) return;
        const idx = videos.findIndex((m) => m.id === activeMovie.id);
        setActiveMovie(videos[(idx + 1) % videos.length]);
      };

      const searchResults = useMemo(() => {
        const term = searchTerm.toLowerCase();
        return videos.filter((m) => m.title.toLowerCase().includes(term) || m.desc.toLowerCase().includes(term));
      }, [videos, searchTerm]);

      const favoriteItems = useMemo(() => videos.filter((m) => favorites.includes(m.id)), [videos, favorites]);

      const goHome = () => { setCurrentTab("home"); setSearchTerm(""); setNavOpen(false); setMobileSearchOpen(false); };

      return (
        <div>
          <nav className={`navbar ${scrolled || currentTab !== "home" || searchTerm ? "scrolled" : ""}`}>
            <div className="nav-left">
              <i className="fas fa-bars nav-hamburger" onClick={() => setNavOpen((o) => !o)}></i>
              <div className="logo" onClick={goHome}>ZIGOUFLIX</div>
              <ul className={`nav-links ${navOpen ? "mobile-open" : ""}`}>
                <li className={`nav-item ${currentTab === "home" ? "active" : ""}`} onClick={goHome}>Accueil</li>
                <li className={`nav-item ${currentTab === "mylist" ? "active" : ""}`} onClick={() => { setCurrentTab("mylist"); setNavOpen(false); }}>
                  Ma Liste {favorites.length > 0 && `(${favorites.length})`}
                </li>
                <li className={`nav-item ${currentTab === "admin" ? "active" : ""}`} onClick={() => { setCurrentTab("admin"); setNavOpen(false); }}>
                  <i className="fas fa-lock" style={{ fontSize: '0.8rem', marginRight: 4 }}></i> Admin
                </li>
              </ul>
            </div>

            <div className="nav-right">
              <button className="refresh-btn" onClick={syncVideos} disabled={isRefreshing} title="Synchroniser avec YouTube">
                <i className={`fas fa-rotate-right ${isRefreshing ? "spinning" : ""}`}></i>
                <span>{isRefreshing ? "Synchronisation…" : "Actualiser YouTube"}</span>
              </button>
              <div className="search-box">
                <i className="fas fa-search" style={{ color: "#aaa" }}></i>
                <input type="text" placeholder="Titres, mots-clés" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} />
                {searchTerm && (
                  <button className="search-clear" onClick={() => setSearchTerm("")} title="Effacer la recherche">
                    <i className="fas fa-times"></i>
                  </button>
                )}
              </div>
              <i className="fas fa-search nav-icon mobile-search-toggle" onClick={() => setMobileSearchOpen(true)}></i>
              <div className="avatar">Z</div>
            </div>
          </nav>

          <div className={`mobile-search-overlay ${mobileSearchOpen ? "open" : ""}`}>
            <div className="search-box">
              <i className="fas fa-search" style={{ color: "#aaa" }}></i>
              <input autoFocus={mobileSearchOpen} type="text" placeholder="Titres, mots-clés" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} />
              {searchTerm && (
                <button className="search-clear" onClick={() => setSearchTerm("")} title="Effacer la recherche">
                  <i className="fas fa-times"></i>
                </button>
              )}
            </div>
            <span className="mobile-search-cancel" onClick={() => { setMobileSearchOpen(false); setSearchTerm(""); }}>Annuler</span>
          </div>

          {currentTab === "home" && !searchTerm && heroMovies.length > 0 && (
            <div className="hero-carousel">
              {heroMovies.map((movie, idx) => (
                <div key={movie.id} className={`hero-slide ${idx === heroIndex ? "active" : ""}`}>
                  <div className="hero-video-wrapper">
                    {idx === heroIndex && !isNarrow ? (
                      <iframe src={`https://www.youtube.com/embed/${movie.id}?autoplay=1&mute=1&controls=0&modestbranding=1&rel=0&loop=1&playlist=${movie.id}`} allow="autoplay"></iframe>
                    ) : (
                      <img src={movie.thumb} alt={movie.title} className="hero-fallback-img" />
                    )}
                  </div>
                  <div className="hero-overlay"></div>

                  <div className="hero-content">
                    <div className="hero-badges">
                      <span className="badge-top10"><span className="n-box">TOP</span> #{idx + 1} des dernières vidéos</span>
                    </div>
                    <h1 className="hero-title">{movie.title}</h1>
                    <div className="hero-meta">
                      <span className="match">{formatViews(movie.views)}</span>
                      <span className="age">{formatDate(movie.published)}</span>
                    </div>
                    <p className="hero-desc">{movie.desc}</p>
                    <div className="hero-btns">
                      <button className="btn btn-main" onClick={() => setActiveMovie(movie)}>
                        <i className="fas fa-play"></i> Lecture
                      </button>
                      <button className="btn-icon-round" onClick={() => toggleFavorite(movie.id)} title={favorites.includes(movie.id) ? "Dans ma liste" : "Ajouter à ma liste"}>
                        <i className={favorites.includes(movie.id) ? "fas fa-check" : "fas fa-plus"}></i>
                      </button>
                    </div>
                  </div>
                </div>
              ))}

              <div className="carousel-indicators">
                {heroMovies.map((_, idx) => (
                  <div key={idx} className={`indicator-dot ${idx === heroIndex ? "active" : ""}`} onClick={() => setHeroIndex(idx)}></div>
                ))}
              </div>
            </div>
          )}

          <main className="main-container" style={{ marginTop: (currentTab !== "home" || searchTerm || heroMovies.length === 0) ? (isNarrow ? "80px" : "100px") : undefined }}>
            {searchTerm ? (
              <div>
                <h2 className="row-title">Résultats pour "{searchTerm}" <span className="row-count">({searchResults.length})</span></h2>
                <div className="video-grid">
                  {searchResults.map((movie) => (
                    <MovieCard key={movie.id} movie={movie} onPlay={setActiveMovie} onInfo={setInfoMovie} isFavorite={favorites.includes(movie.id)} onToggleFavorite={toggleFavorite} />
                  ))}
                </div>
                {searchResults.length === 0 && <p className="empty-note">Aucun résultat trouvé.</p>}
              </div>
            ) : currentTab === "mylist" ? (
              <div>
                <h2 className="row-title">Ma Liste Personnelle</h2>
                <div className="video-grid">
                  {favoriteItems.map((movie) => (
                    <MovieCard key={movie.id} movie={movie} onPlay={setActiveMovie} onInfo={setInfoMovie} isFavorite={true} onToggleFavorite={toggleFavorite} />
                  ))}
                </div>
                {favoriteItems.length === 0 && <p className="empty-note">Votre liste est vide pour le moment.</p>}
              </div>
            ) : currentTab === "admin" ? (
              <div className="admin-container">
                {!isAdminAuthenticated ? (
                  <div className="modal-overlay">
                    <form className="secret-modal" onSubmit={handlePassSubmit}>
                      <i className="fas fa-user-shield" style={{ fontSize: '2.5rem', color: 'var(--zigou-red)', marginBottom: 12 }}></i>
                      <h2>Espace Secret / Gestion</h2>
                      <p style={{ color: '#aaa', fontSize: '0.85rem', marginTop: 6 }}>Entrez le code d'accès pour administrer les vidéos</p>
                      <input
                        type="password"
                        className="secret-input"
                        placeholder="Mot de passe"
                        value={secretInput}
                        onChange={(e) => setSecretInput(e.target.value)}
                        autoFocus
                      />
                      {passError && <p style={{ color: 'var(--zigou-red-bright)', fontSize: '0.8rem', marginBottom: 10 }}>Code d'accès incorrect</p>}
                      <button className="btn btn-main" style={{ width: '100%', justifyContent: 'center' }} type="submit">Valider</button>
                    </form>
                  </div>
                ) : (
                  <div>
                    <h2 className="row-title" style={{ marginLeft: 0, marginBottom: 20 }}>
                      <i className="fas fa-cog"></i> Zone d'administration des vidéos
                    </h2>

                    <div className="admin-card">
                      <div className="admin-title"><i className="fas fa-key"></i> Source du catalogue</div>
                      <div className="admin-field-row">
                        <input
                          type="text"
                          className="admin-input"
                          placeholder="Clé API YouTube Data v3 (optionnel, pour le catalogue complet)"
                          value={apiKeyOverride}
                          onChange={(e) => setApiKeyOverride(e.target.value)}
                        />
                        <button className="btn-admin-action" onClick={syncVideos} disabled={isRefreshing}>
                          <i className={`fas fa-rotate-right ${isRefreshing ? "spinning" : ""}`}></i> Resynchroniser
                        </button>
                      </div>
                      <p className="admin-hint">
                        {syncMode === "api"
                          ? <>Mode actif : <strong style={{ color: '#6ee7a4' }}>API YouTube</strong> — catalogue complet ({videos.filter(v => v.source !== 'manual').length} vidéos) avec vraies statistiques de vues.</>
                          : <>Mode actif : <strong style={{ color: '#ffd166' }}>flux RSS</strong> — limité aux ~15 dernières vidéos publiques, sans compteur de vues fiable. Renseignez une clé API ci-dessus (gratuite sur Google Cloud Console, service "YouTube Data API v3") pour charger tout le catalogue avec de vraies statistiques.</>
                        }
                        {lastSync && <> Dernière synchro : {lastSync.toLocaleTimeString("fr-FR")}.</>}
                      </p>
                    </div>

                    <div className="admin-card">
                      <div className="admin-title"><i className="fas fa-plus-circle"></i> Ajouter une vidéo manuellement</div>
                      <form className="admin-field-row" onSubmit={handleAddVideo}>
                        <input
                          type="text"
                          className="admin-input"
                          placeholder="URL YouTube ou identifiant (ex : https://www.youtube.com/watch?v=XXXXXXXXXXX)"
                          value={addVideoInput}
                          onChange={(e) => setAddVideoInput(e.target.value)}
                        />
                        <button className="btn-admin-action" type="submit" disabled={isAddingVideo || !addVideoInput.trim()}>
                          {isAddingVideo ? <><i className="fas fa-circle-notch fa-spin"></i> Ajout…</> : <><i className="fas fa-plus"></i> Ajouter</>}
                        </button>
                      </form>
                      {addVideoError && <p className="admin-form-error">{addVideoError}</p>}
                      <p className="admin-hint">Utile pour ajouter une vidéo qui n'apparaît pas encore dans le flux RSS, ou une vidéo hors chaîne.</p>
                    </div>
                    
                    <div className="admin-card">
                      <div className="admin-title"><i className="fas fa-list"></i> Gestion des contenus ({videos.length})</div>
                      {videos.length === 0 ? (
                        <p style={{ color: '#aaa' }}>Aucune vidéo dans le catalogue.</p>
                      ) : (
                        <table className="admin-table">
                          <thead>
                            <tr>
                              <th>Aperçu</th>
                              <th>Titre</th>
                              <th>Date</th>
                            </tr>
                          </thead>
                          <tbody>
                            {videos.map((vid) => (
                              <tr key={vid.id}>
                                <td style={{ width: 80 }}><img src={vid.thumb} style={{ width: 60, height: 35, objectFit: 'cover', borderRadius: 3 }} /></td>
                                <td>
                                  {vid.title}
                                  {vid.source === "manual" && <span className="admin-tag manual">Manuel</span>}
                                  {vid.source === "api" && <span className="admin-tag api">API</span>}
                                  {vid.source === "rss" && <span className="admin-tag rss">RSS</span>}
                                  {vid.source === "fallback" && <span className="admin-tag manual">Secours</span>}
                                </td>
                                <td>{formatDate(vid.published)}</td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      )}
                    </div>
                  </div>
                )}
              </div>
            ) : (
              <div>
                <h2 className="row-title">
                  {videos.length > 0 ? `Toutes les vidéos de la chaîne (${videos.length})` : "Catalogue Zigouflix"}
                </h2>
                {videos.length > 0 ? (
                  <div className="video-grid">
                    {videos.map((movie) => (
                      <MovieCard key={movie.id} movie={movie} onPlay={setActiveMovie} onInfo={setInfoMovie} isFavorite={favorites.includes(movie.id)} onToggleFavorite={toggleFavorite} />
                    ))}
                  </div>
                ) : (
                  <p className="empty-note">
                    {isRefreshing ? "Chargement du catalogue en cours..." : "Aucune vidéo chargée."}
                  </p>
                )}
                {lastSync && (
                  <p className="empty-note" style={{ marginTop: 10 }}>
                    Dernière synchronisation YouTube : {lastSync.toLocaleTimeString("fr-FR")}
                  </p>
                )}
              </div>
            )}
          </main>

          {infoMovie && (
            <InfoModal movie={infoMovie} onClose={() => setInfoMovie(null)} onPlay={playFromInfo} isFavorite={favorites.includes(infoMovie.id)} onToggleFavorite={toggleFavorite} />
          )}

          {activeMovie && (
            <NetflixPlayer movie={activeMovie} onClose={() => setActiveMovie(null)} onNext={playNext} />
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
