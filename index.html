      { id: "WQrmiOMZrRk", title: "Couleurs & Émotions", desc: "Comment la palette de couleurs d'un film influence vos sentiments à votre insu à chaque plan.", match: "95%", age: "Tous", duration: "7m", tags: "Inspirant • Esthétique • 4K", cast: "Un essai visuel primé en festival", genres: "Documentaire, Art, Design" },
      { id: "0dcY-benLkU", title: "L'Art du Cadre", desc: "Découvrez comment la géométrie et la lumière façonnent les grands chefs-d'œuvre du cinéma mondial.", match: "96%", age: "Tous", duration: "8m", tags: "Cinéma • Masterclass • HDR", cast: "Masterclass animée par des chefs opérateurs", genres: "Documentaire, Éducatif" },
      { id: "F5ffp2CP8rk", title: "Plan Séquence Épique", desc: "Analyse technique d'une scène d'action fluide tournée sans aucune coupure apparente.", match: "94%", age: "16+", duration: "15m", tags: "Intense • Rythmé • 5.1", cast: "Cascadeurs et cadreurs professionnels", genres: "Action, Making-of" },
      { id: "XpdAJHyo_PU", title: "Montage Frénétique", desc: "Quand le rythme de l'image s'accorde parfaitement à la musique pour créer une expérience visuelle inédite.", match: "91%", age: "Tous", duration: "18m", tags: "Musique • Montage • HD", cast: "Collectif de monteurs indépendants", genres: "Musical, Expérimental" }
    ];

    const withProgress = (arr) => arr.map((m, i) => ({ ...m, progress: [72, 35, 90, 18, 55, 40][i % 6] }));

    const categories = [
      { title: "Tendances actuelles", top10: true, items: RAW },
      { title: "Continuer à regarder pour Vous", items: withProgress([...RAW].reverse()), continueWatching: true },
      { title: "Recommandé pour vous", items: [RAW[2], RAW[4], RAW[0], RAW[5], RAW[1], RAW[3]] },
      { title: "Zigoune le commencement", items: [RAW[1], RAW[3], RAW[5], RAW[0], RAW[2], RAW[4]] }
    ];

    /* ===================== PLAYER ===================== */
    function NetflixPlayer({ movie, onClose, onNext }) {
      const playerRef = useRef(null);
      const [isPlaying, setIsPlaying] = useState(true);
      const [isReady, setIsReady] = useState(false);
      const [currentTime, setCurrentTime] = useState(0);
      const [duration, setDuration] = useState(0);
      const [volume, setVolume] = useState(100);
      const [isMuted, setIsMuted] = useState(false);
      const [controlsVisible, setControlsVisible] = useState(true);
      const hideControlsTimeout = useRef(null);

      useEffect(() => {
        let ytPlayer;
        let destroyed = false;

        const onYouTubeIframeAPIReady = () => {
          ytPlayer = new window.YT.Player('netflix-yt-iframe', {
            events: {
              'onReady': (event) => {
                if (destroyed) return;
                playerRef.current = event.target;
                event.target.playVideo();
                setDuration(event.target.getDuration());
                setIsReady(true);
              },
              'onStateChange': (event) => {
                if (event.data === window.YT.PlayerState.PLAYING) setIsPlaying(true);
                else if (event.data === window.YT.PlayerState.PAUSED) setIsPlaying(false);
                else if (event.data === window.YT.PlayerState.ENDED) onNext();
              }
            }
          });
        };

        if (!window.YT || !window.YT.Player) {
          const tag = document.createElement('script');
          tag.src = "https://www.youtube.com/iframe_api";
          window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;
          document.body.appendChild(tag);
        } else {
          onYouTubeIframeAPIReady();
        }

        const timer = setInterval(() => {
          if (playerRef.current && playerRef.current.getCurrentTime) {
            setCurrentTime(playerRef.current.getCurrentTime());
            setDuration(playerRef.current.getDuration() || 0);
          }
        }, 500);

        return () => {
          destroyed = true;
          clearInterval(timer);
          if (ytPlayer && ytPlayer.destroy) ytPlayer.destroy();
        };
      }, [movie.id]);

      const togglePlay = useCallback(() => {
        if (!playerRef.current) return;
        if (playerRef.current.getPlayerState() === 1) {
          playerRef.current.pauseVideo();
        } else {
          playerRef.current.playVideo();
        }
      }, []);

      const handleSeek = (e) => {
        const rect = e.currentTarget.getBoundingClientRect();
        const clickPosition = (e.clientX - rect.left) / rect.width;
        const targetTime = Math.max(0, Math.min(1, clickPosition)) * duration;
        if (playerRef.current) {
          playerRef.current.seekTo(targetTime, true);
          setCurrentTime(targetTime);
        }
      };

      const handleSkip = useCallback((seconds) => {
        if (playerRef.current) {
          const newTime = Math.max(0, playerRef.current.getCurrentTime() + seconds);
          playerRef.current.seekTo(newTime, true);
        }
      }, []);

      const handleVolumeChange = (e) => {
        const val = Number(e.target.value);
        setVolume(val);
        if (playerRef.current) {
          playerRef.current.setVolume(val);
          if (val === 0) { playerRef.current.mute(); setIsMuted(true); }
          else { playerRef.current.unMute(); setIsMuted(false); }
        }
      };

      const toggleMute = useCallback(() => {
        if (!playerRef.current) return;
        if (playerRef.current.isMuted()) { playerRef.current.unMute(); setIsMuted(false); }
        else { playerRef.current.mute(); setIsMuted(true); }
      }, []);

      const toggleFullscreen = useCallback(() => {
        const elem = document.getElementById('netflix-player-root');
        if (!document.fullscreenElement) elem.requestFullscreen().catch(() => {});
        else document.exitFullscreen();
      }, []);

      const changeVolume = useCallback((delta) => {
        if (!playerRef.current) return;
        const next = Math.max(0, Math.min(100, playerRef.current.getVolume() + delta));
        playerRef.current.setVolume(next);
        setVolume(next);
        if (next === 0) setIsMuted(true); else { playerRef.current.unMute(); setIsMuted(false); }
      }, []);

      // Clavier: espace/K play-pause, flèches seek/volume, M mute, F plein écran, Échap fermer
      useEffect(() => {
        const onKeyDown = (e) => {
          switch (e.key) {
            case ' ': case 'k': e.preventDefault(); togglePlay(); break;
            case 'ArrowRight': handleSkip(10); break;
            case 'ArrowLeft': handleSkip(-10); break;
            case 'ArrowUp': e.preventDefault(); changeVolume(10); break;
            case 'ArrowDown': e.preventDefault(); changeVolume(-10); break;
            case 'm': toggleMute(); break;
            case 'f': toggleFullscreen(); break;
            case 'Escape': onClose(); break;
          }
        };
        window.addEventListener('keydown', onKeyDown);
        return () => window.removeEventListener('keydown', onKeyDown);
      }, [togglePlay, handleSkip, changeVolume, toggleMute, toggleFullscreen, onClose]);

      const handleMouseMove = () => {
        setControlsVisible(true);
        clearTimeout(hideControlsTimeout.current);
        hideControlsTimeout.current = setTimeout(() => {
          if (isPlaying) setControlsVisible(false);
        }, 3200);
      };

      useEffect(() => { handleMouseMove(); }, [isPlaying]);

      const formatTime = (sec) => {
        if (isNaN(sec)) return "00:00";
        const h = Math.floor(sec / 3600);
        const m = Math.floor((sec % 3600) / 60);
        const s = Math.floor(sec % 60);
        return h > 0
          ? `${h}:${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`
          : `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
      };

      const progressPercent = duration > 0 ? (currentTime / duration) * 100 : 0;
      const nearEnd = duration > 0 && duration - currentTime < 12 && duration - currentTime > 0;

      return (
        <div
          id="netflix-player-root"
          className={`netflix-player-overlay ${!controlsVisible && isPlaying ? 'hide-cursor' : ''}`}
          onMouseMove={handleMouseMove}
          onDoubleClick={toggleFullscreen}
        >
          <div className="player-video-container">
            <iframe
              id="netflix-yt-iframe"
              src={`https://www.youtube.com/embed/${movie.id}?enablejsapi=1&controls=0&autoplay=1&modestbranding=1&rel=0&iv_load_policy=3`}
              allow="autoplay; fullscreen"
            ></iframe>
          </div>

          {!isReady && (
            <div className="player-loading"><i className="fas fa-circle-notch fa-spin"></i></div>
          )}

          <div className="kbd-hint" style={{ opacity: controlsVisible ? 1 : 0 }}>
            <span><kbd>Espace</kbd>lecture</span>
            <span><kbd>←→</kbd>avance/recule</span>
            <span><kbd>F</kbd>plein écran</span>
            <span><kbd>Échap</kbd>quitter</span>
          </div>

          <div className="player-top-bar" style={{ opacity: controlsVisible ? 1 : 0, pointerEvents: controlsVisible ? 'auto' : 'none' }}>
            <button className="back-btn" onClick={onClose} title="Retour à l'accueil">
              <i className="fas fa-arrow-left"></i>
            </button>
            <div className="player-title-block">
              <span className="player-movie-title">{movie.title}</span>
              <div className="player-movie-meta">
                <span className="match">{movie.match} pertinent</span>
                <span>{movie.age}</span>
                <span className="quality-tag">4K</span>
                <span className="quality-tag">5.1</span>
              </div>
            </div>
            {nearEnd && (
              <button className="player-next-btn" onClick={onNext}>
                <i className="fas fa-step-forward"></i> Lecture suivante
              </button>
            )}
          </div>

          <div className="player-controls-bottom" style={{ opacity: controlsVisible ? 1 : 0, pointerEvents: controlsVisible ? 'auto' : 'none' }}>
            <div className="progress-bar-container" onClick={handleSeek}>
              <div className="progress-bar-fill" style={{ width: `${progressPercent}%` }}>
                <div className="progress-bar-scrubber"></div>
              </div>
            </div>

            <div className="controls-row">
              <div className="controls-left">
                <button className="control-btn" onClick={togglePlay}>
                  <i className={isPlaying ? "fas fa-pause" : "fas fa-play"}></i>
                </button>
                <button className="control-btn" onClick={() => handleSkip(-10)} title="Reculer 10s">
                  <i className="fas fa-undo-alt"></i>
                </button>
                <button className="control-btn" onClick={() => handleSkip(10)} title="Avancer 10s">
                  <i className="fas fa-redo-alt"></i>
                </button>
                <button className="control-btn" onClick={onNext} title="Suivant">
                  <i className="fas fa-step-forward"></i>
                </button>
                <div className="volume-container">
                  <button className="control-btn" onClick={toggleMute}>
                    <i className={isMuted || volume === 0 ? "fas fa-volume-mute" : volume < 50 ? "fas fa-volume-down" : "fas fa-volume-up"}></i>
                  </button>
                  <input type="range" min="0" max="100" value={isMuted ? 0 : volume} onChange={handleVolumeChange} className="volume-slider" />
                </div>
                <div className="time-display">{formatTime(currentTime)} / {formatTime(duration)}</div>
              </div>

              <div className="controls-right">
                <button className="control-btn" title="Épisodes suivants"><i className="fas fa-list-ul"></i></button>
                <button className="control-btn" onClick={toggleFullscreen} title="Plein écran">
                  <i className="fas fa-expand"></i>
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    /* ===================== CARD ===================== */
    function MovieCard({ movie, onPlay, onInfo, isFavorite, onToggleFavorite, rank }) {
      const [hovered, setHovered] = useState(false);
      const previewSrc = `https://www.youtube.com/embed/${movie.id}?autoplay=1&mute=1&controls=0&modestbranding=1&rel=0&loop=1&playlist=${movie.id}`;

      return (
        <div className={`card-container ${rank ? 'top10' : ''}`}>
          {rank && <span className="rank-number">{rank}</span>}
          <div
            className={`card ${hovered ? 'expanded' : ''}`}
            onMouseEnter={() => setHovered(true)}
            onMouseLeave={() => setHovered(false)}
            onClick={() => hovered && onInfo(movie)}
          >
            <img src={`https://img.youtube.com/vi/${movie.id}/hqdefault.jpg`} alt={movie.title} className="card-img" />

            {hovered && (
              <iframe src={previewSrc} className="card-preview" frameBorder="0" allow="autoplay"></iframe>
            )}

            {movie.progress !== undefined && (
              <div className="progress-mini">
                <div className="progress-mini-fill" style={{ width: `${movie.progress}%` }}></div>
              </div>
            )}

            <div className="card-body">
              <div className="card-actions">
                <div className="card-actions-left">
                  <button className="icon-btn icon-btn-play" onClick={(e) => { e.stopPropagation(); onPlay(movie); }} title="Regarder">
                    <i className="fas fa-play"></i>
                  </button>
                  <button
                    className={`icon-btn ${isFavorite ? 'active' : ''}`}
                    onClick={(e) => { e.stopPropagation(); onToggleFavorite(movie.id); }}
                    title={isFavorite ? "Retirer de ma liste" : "Ajouter à ma liste"}
                  >
                    <i className={isFavorite ? "fas fa-check" : "fas fa-plus"}></i>
                  </button>
                </div>
                <button className="icon-btn" onClick={(e) => { e.stopPropagation(); onInfo(movie); }} title="Plus d'infos">
                  <i className="fas fa-chevron-down"></i>
                </button>
              </div>

              <div className="card-info">
                <span className="match">{movie.match}</span>
                <span className="age">{movie.age}</span>
                <span className="quality-tag">4K</span>
                <span>{movie.duration}</span>
              </div>

              <div className="card-title-text">{movie.title}</div>
              <div className="card-tags">{movie.tags}</div>
            </div>
          </div>
        </div>
      );
    }

    /* ===================== ROW WITH ARROWS ===================== */
    function Row({ category, onPlay, onInfo, favorites, onToggleFavorite }) {
      const rowRef = useRef(null);

      const scroll = (dir) => {
        if (!rowRef.current) return;
        const amount = rowRef.current.clientWidth * 0.85;
        rowRef.current.scrollBy({ left: dir * amount, behavior: 'smooth' });
      };

      return (
        <div>
          <h2 className="row-title">{category.title}</h2>
          <div className="row-wrapper">
            <div className="row-arrow left" onClick={() => scroll(-1)}><i className="fas fa-chevron-left"></i></div>
            <div className="video-row" ref={rowRef}>
              {category.items.map((movie, i) => (
                <MovieCard
                  key={movie.id + '-' + i}
                  movie={movie}
                  rank={category.top10 ? i + 1 : null}
                  onPlay={onPlay}
                  onInfo={onInfo}
                  isFavorite={favorites.includes(movie.id)}
                  onToggleFavorite={onToggleFavorite}
                />
              ))}
            </div>
            <div className="row-arrow right" onClick={() => scroll(1)}><i className="fas fa-chevron-right"></i></div>
          </div>
        </div>
      );
    }

    /* ===================== INFO MODAL ===================== */
    function InfoModal({ movie, onClose, onPlay, isFavorite, onToggleFavorite }) {
      const previewSrc = `https://www.youtube.com/embed/${movie.id}?autoplay=1&mute=1&controls=0&modestbranding=1&rel=0&loop=1&playlist=${movie.id}`;
      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal-box" onClick={(e) => e.stopPropagation()}>
            <div className="modal-hero">
              <iframe src={previewSrc} allow="autoplay"></iframe>
              <div className="modal-hero-overlay"></div>
              <button className="modal-close" onClick={onClose}><i className="fas fa-times"></i></button>
              <div className="modal-hero-title">{movie.title}</div>
              <div className="modal-hero-btns">
                <button className="btn-icon-round" style={{ background: '#fff', color: '#000', border: 'none', width: 46, height: 46 }} onClick={() => onPlay(movie)}>
                  <i className="fas fa-play"></i>
                </button>
                <button className="btn-icon-round" onClick={() => onToggleFavorite(movie.id)}>
                  <i className={isFavorite ? "fas fa-check" : "fas fa-plus"}></i>
                </button>
              </div>
            </div>
            <div className="modal-body">
              <div className="modal-meta-row">
                <span className="match">{movie.match} pertinent</span>
                <span>{movie.duration}</span>
                <span className="age">{movie.age}</span>
                <span className="quality-tag">4K</span>
                <span className="quality-tag">HDR</span>
              </div>
              <p className="modal-desc">{movie.desc}</p>
              <div className="modal-tags">
                <div><b>Distribution : </b><span>{movie.cast}</span></div>
                <div><b>Genres : </b><span>{movie.genres}</span></div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    /* ===================== APP ===================== */
    function App() {
      const [currentTab, setCurrentTab] = useState('home');
      const [searchTerm, setSearchTerm] = useState('');
      const [activeMovie, setActiveMovie] = useState(null);
      const [infoMovie, setInfoMovie] = useState(null);
      const [heroIndex, setHeroIndex] = useState(0);
      const [scrolled, setScrolled] = useState(false);

      const heroMovies = RAW;

      useEffect(() => {
        if (currentTab !== 'home' || searchTerm || activeMovie) return;
        const interval = setInterval(() => setHeroIndex(prev => (prev + 1) % heroMovies.length), 5000);
        return () => clearInterval(interval);
      }, [currentTab, searchTerm, heroMovies.length, activeMovie]);

      useEffect(() => {
        const onScroll = () => setScrolled(window.scrollY > 20);
        window.addEventListener('scroll', onScroll);
        return () => window.removeEventListener('scroll', onScroll);
      }, []);

      const [favorites, setFavorites] = useState([]);
      const toggleFavorite = (id) => {
        setFavorites(prev => prev.includes(id) ? prev.filter(f => f !== id) : [...prev, id]);
      };

      const playFromInfo = (movie) => { setInfoMovie(null); setActiveMovie(movie); };

      const playNext = () => {
        const all = RAW;
        const idx = all.findIndex(m => m.id === activeMovie.id);
        setActiveMovie(all[(idx + 1) % all.length]);
      };

      const allSearchable = RAW;
      const searchResults = allSearchable.filter(m =>
        m.title.toLowerCase().includes(searchTerm.toLowerCase()) || m.tags.toLowerCase().includes(searchTerm.toLowerCase())
      );
      const favoriteItems = allSearchable.filter(m => favorites.includes(m.id));

      return (
        <div>
          <nav className={`navbar ${scrolled || currentTab !== 'home' || searchTerm ? 'scrolled' : ''}`}>
            <div className="nav-left">
              <div className="logo" onClick={() => { setCurrentTab('home'); setSearchTerm(''); }}>ZIGOUFLIX</div>
              <ul className="nav-links">
                <li className={`nav-item ${currentTab === 'home' ? 'active' : ''}`} onClick={() => setCurrentTab('home')}>Accueil</li>
                <li className="nav-item">Séries</li>
                <li className="nav-item">Films</li>
                <li className="nav-item">Nouveautés</li>
                <li className={`nav-item ${currentTab === 'mylist' ? 'active' : ''}`} onClick={() => setCurrentTab('mylist')}>
                  Ma Liste {favorites.length > 0 && `(${favorites.length})`}
                </li>
              </ul>
            </div>

            <div className="nav-right">
              <div className="search-box">
                <i className="fas fa-search" style={{ color: '#aaa' }}></i>
                <input type="text" placeholder="Titres, personnes, genres" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} />
              </div>
              <i className="nav-icon fas fa-bell"></i>
              <div className="avatar">Z</div>
            </div>
          </nav>

          {currentTab === 'home' && !searchTerm && (
            <div className="hero-carousel">
              {heroMovies.map((movie, idx) => (
                <div key={movie.id} className={`hero-slide ${idx === heroIndex ? 'active' : ''}`}>
                  <div className="hero-video-wrapper">
                    {idx === heroIndex && (
                      <iframe src={`https://www.youtube.com/embed/${movie.id}?autoplay=1&mute=1&controls=0&modestbranding=1&rel=0&loop=1&playlist=${movie.id}`} allow="autoplay"></iframe>
                    )}
                  </div>
                  <div className="hero-overlay"></div>

                  <div className="hero-content">
                    <div className="hero-badges">
                      <span className="badge-top10"><span className="n-box">TOP 10</span> #{idx + 1} en tendance aujourd'hui</span>
                    </div>
                    <h1 className="hero-title">{movie.title}</h1>
                    <div className="hero-meta">
                      <span className="match">{movie.match} pertinent</span>
                      <span className="age">{movie.age}</span>
                      <span className="badge-quality">4K ULTRA HD</span>
                      <span className="badge-quality">HDR</span>
                    </div>
                    <p className="hero-desc">{movie.desc}</p>
                    <div className="hero-btns">
                      <button className="btn btn-main" onClick={() => setActiveMovie(movie)}>
                        <i className="fas fa-play"></i> Lecture
                      </button>
                      <button className="btn btn-sec" onClick={() => setInfoMovie(movie)}>
                        <i className="fas fa-info-circle"></i> Plus d'infos
                      </button>
                      <button className="btn-icon-round" onClick={() => toggleFavorite(movie.id)} title={favorites.includes(movie.id) ? "Dans ma liste" : "Ajouter à ma liste"}>
                        <i className={favorites.includes(movie.id) ? "fas fa-check" : "fas fa-plus"}></i>
                      </button>
                    </div>
                  </div>
                  <div className="age-gate">{movie.age}</div>
                </div>
              ))}

              <div className="carousel-indicators">
                {heroMovies.map((_, idx) => (
                  <div key={idx} className={`indicator-dot ${idx === heroIndex ? 'active' : ''}`} onClick={() => setHeroIndex(idx)}></div>
                ))}
              </div>
            </div>
          )}

          <main className="main-container" style={{ marginTop: (currentTab === 'mylist' || searchTerm) ? '100px' : '-90px' }}>
            {searchTerm ? (
              <div>
                <h2 className="row-title">Résultats pour "{searchTerm}"</h2>
                <div className="video-grid">
                  {searchResults.map(movie => (
                    <MovieCard key={movie.id} movie={movie} onPlay={setActiveMovie} onInfo={setInfoMovie} isFavorite={favorites.includes(movie.id)} onToggleFavorite={toggleFavorite} />
                  ))}
                  {searchResults.length === 0 && <p style={{ color: '#888' }}>Aucun résultat trouvé.</p>}
                </div>
              </div>
            ) : currentTab === 'mylist' ? (
              <div>
                <h2 className="row-title">Ma Liste Personnelle</h2>
                <div className="video-grid">
                  {favoriteItems.map(movie => (
                    <MovieCard key={movie.id} movie={movie} onPlay={setActiveMovie} onInfo={setInfoMovie} isFavorite={true} onToggleFavorite={toggleFavorite} />
                  ))}
                  {favoriteItems.length === 0 && <p style={{ color: '#888' }}>Votre liste est vide pour le moment.</p>}
                </div>
              </div>
            ) : (
              categories.map((cat, i) => (
                <Row key={i} category={cat} onPlay={setActiveMovie} onInfo={setInfoMovie} favorites={favorites} onToggleFavorite={toggleFavorite} />
              ))
            )}
          </main>

          {infoMovie && (
            <InfoModal movie={infoMovie} onClose={() => setInfoMovie(null)} onPlay={playFromInfo} isFavorite={favorites.includes(infoMovie.id)} onToggleFavorite={toggleFavorite} />
          )}

          {activeMovie && (
            <NetflixPlayer movie={activeMovie} onClose={() => setActiveMovie(null)} onNext={playNext} />
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
